<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JB Stock Count</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap');

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --accent: #e8ff47;
    --accent2: #ff6b35;
    --text: #f0f0f0;
    --muted: #666;
    --ink: #5b9fff;
    --cons: #ff9f47;
    --screens: #a78bfa;
    --dtf: #34d399;
    --danger: #ff4747;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--accent); }
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .badge-date {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  /* CUSTOMER SELECT */
  .customer-select {
    padding: 24px 20px 0;
  }
  .customer-select h2 {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .customer-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .customer-card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .customer-card:hover { border-color: var(--accent); }
  .customer-card.active {
    border-color: var(--accent);
    background: #1e2200;
  }
  .customer-card img {
    display: block;
    width: 100%;
    max-width: 150px;
    height: 40px;
    object-fit: contain;
    margin-bottom: 4px;
  }
  .customer-card .name {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 4px;
  }
  .customer-card .type {
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }
  .consignment-badge {
    display: inline-block;
    background: #2a1a00;
    color: var(--cons);
    border: 1px solid var(--cons);
    border-radius: 4px;
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    padding: 2px 6px;
    margin-top: 6px;
  }

  /* CATEGORY TABS */
  .cat-tabs {
    display: flex;
    gap: 6px;
    padding: 16px 20px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .cat-tabs::-webkit-scrollbar { display: none; }
  .cat-tab {
    flex-shrink: 0;
    border: none;
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--surface);
    color: var(--muted);
  }
  .cat-tab.active-ink { background: rgba(91,159,255,0.15); color: var(--ink); }
  .cat-tab.active-consumables { background: rgba(255,159,71,0.15); color: var(--cons); }
  .cat-tab.active-screens { background: rgba(167,139,250,0.15); color: var(--screens); }
  .cat-tab.active-dtf { background: rgba(52,211,153,0.15); color: var(--dtf); }

  /* ITEMS */
  .items-area {
    padding: 0 20px;
  }
  .cat-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .cat-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }
  .cat-label {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .cat-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-left: auto;
  }

  .item-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .item-info { flex: 1; min-width: 0; }
  .item-name {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-code {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
  }
  .item-controls {
    display: flex;
    align-items: center;
    gap: 0;
    flex-shrink: 0;
  }
  .qty-btn {
    width: 32px; height: 32px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    transition: all 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .qty-btn:first-child { border-radius: 8px 0 0 8px; }
  .qty-btn:last-child { border-radius: 0 8px 8px 0; }
  .qty-btn:active { background: var(--accent); color: #000; }
  .qty-input {
    width: 44px;
    height: 32px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-left: none;
    border-right: none;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    text-align: center;
    outline: none;
  }
  .qty-input:focus {
    background: #1e2200;
    color: var(--accent);
  }

  /* Consignment: two inputs */
  .two-inputs {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
  }
  .input-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .input-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    text-transform: uppercase;
    width: 32px;
    text-align: right;
  }
  .mini-input {
    width: 56px;
    height: 28px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    text-align: center;
    outline: none;
  }
  .mini-input:focus {
    border-color: var(--accent);
    color: var(--accent);
  }
  .usage-display {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-align: right;
  }
  .usage-display.has-usage { color: var(--accent2); }

  /* SUMMARY STRIP */
  .summary-strip {
    position: sticky;
    bottom: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .summary-items {
    flex: 1;
  }
  .summary-line {
    font-size: 12px;
    color: var(--muted);
  }
  .summary-line strong {
    color: var(--text);
    font-family: 'DM Mono', monospace;
  }
  .send-btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .send-btn:hover { background: #d4eb00; }
  .send-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 400px;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal h3 {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 16px;
  }
  .preview-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    gap: 8px;
  }
  .preview-row:last-child { border-bottom: none; }
  .preview-name { flex: 1; color: var(--text); line-height: 1.3; }
  .preview-qty {
    font-family: 'DM Mono', monospace;
    color: var(--accent);
    flex-shrink: 0;
  }
  .preview-usage {
    font-family: 'DM Mono', monospace;
    color: var(--accent2);
    flex-shrink: 0;
    font-size: 11px;
  }
  .modal-cat-header {
    font-family: 'Syne', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 14px 0 6px;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .modal-cancel {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 12px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .modal-confirm {
    flex: 2;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .modal-confirm:hover { background: #d4eb00; }

  /* SUCCESS */
  .success-state {
    text-align: center;
    padding: 20px 0;
  }
  .success-icon {
    font-size: 48px;
    margin-bottom: 12px;
  }
  .success-state h3 {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    margin-bottom: 8px;
  }
  .success-state p { color: var(--muted); font-size: 13px; line-height: 1.5; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 13px;
  }

  .section-divider {
    height: 1px;
    background: var(--border);
    margin: 16px 0;
  }

  .rep-field {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .rep-field label {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  .rep-field input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 8px 10px;
    outline: none;
  }
  .rep-field input:focus { border-color: var(--accent); }

  .notes-field {
    margin-top: 12px;
  }
  .notes-field label {
    font-size: 11px;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
  }
  .notes-field textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 8px 10px;
    outline: none;
    resize: vertical;
    min-height: 60px;
  }
  .notes-field textarea:focus { border-color: var(--accent); }

  @media print {
    body { background: #fff !important; }
    .pdf-container { display: block !important; }
  }
  .pdf-container { display: none; }
</style>
</head>

// ============================================================
let currentCustomer = 'amc';
let currentCat = 'ink';
let counts = {};      // { 'amc-UPLCBL5': { count: 5 } } or { prev: 3, curr: 5 } for consignment

function key(code) { return `${currentCustomer}-${code}`; }
function getCount(code) { return counts[key(code)] || {}; }
function setCount(code, field, val) {
  if (!counts[key(code)]) counts[key(code)] = {};
  counts[key(code)][field] = val;
  updateSummary();
}

// ============================================================
// INIT
// ============================================================
document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });

selectCustomer('amc');

function selectCustomer(cid) {
  currentCustomer = cid;
  currentCat = 'ink';
  document.getElementById('card-amc').classList.toggle('active', cid === 'amc');
  document.getElementById('card-eb').classList.toggle('active', cid === 'eb');
  renderTabs();
  renderItems();
  updateSummary();
}

function selectCat(cat) {
  currentCat = cat;
  renderTabs();
  renderItems();
}

function renderTabs() {
  const cust = CUSTOMERS[currentCustomer];
  const cats = [...new Set(cust.products.map(p => p.cat))];
  const tabs = document.getElementById('catTabs');
  tabs.innerHTML = cats.map(c => `
    <button class="cat-tab ${currentCat === c ? 'active-' + c : ''}" onclick="selectCat('${c}')">
      ${CATEGORIES[c].label}
    </button>
  `).join('');
}

function renderItems() {
  const cust = CUSTOMERS[currentCustomer];
  const products = cust.products.filter(p => p.cat === currentCat);
  const area = document.getElementById('itemsArea');
  const cat = CATEGORIES[currentCat];

  let html = `<div class="cat-header" style="margin-top:4px;">
    <div class="cat-dot" style="background:${cat.dot}"></div>
    <div class="cat-label" style="color:${cat.color}">${cat.label}</div>
    <div class="cat-count">${products.length} items</div>
  </div>`;

  if (cust.isConsignment) {
    products.forEach(p => {
      const d = getCount(p.code);
      const prev = p.prev !== undefined ? p.prev : (d.prev !== undefined ? d.prev : '');
      if (d.prev === undefined && prev !== '') setCount(p.code, 'prev', prev);
      const curr = d.curr !== undefined ? d.curr : '';
      const usage = (prev !== '' && curr !== '' && !isNaN(prev) && !isNaN(curr))
        ? (parseFloat(prev) - parseFloat(curr))
        : null;
      const usageClass = usage !== null && usage > 0 ? 'has-usage' : '';
      const usageText = usage !== null ? `Used: ${usage}  →  Top-up: ${Math.max(0, usage)}` : '';
      html += `<div class="item-card">
        <div class="item-info">
          <div class="item-name" title="${p.name}">${p.name}</div>
          <div class="item-code">${p.code}</div>
        </div>
        <div class="two-inputs">
          <div class="input-row">
            <span class="input-label" style="color:var(--muted);">WAS</span>
            <div class="mini-input" style="display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--muted);border-color:var(--border);font-size:13px;border-radius:6px;height:28px;width:56px;">${prev !== '' ? prev : '—'}</div>
          </div>
          <div class="input-row">
            <span class="input-label">NOW</span>
            <input class="mini-input" type="number" min="0" placeholder="0"
              value="${curr}"
              onchange="setCount('${p.code}','curr',this.value); updateUsageDisplay('${p.code}')"
              oninput="setCount('${p.code}','curr',this.value); updateUsageDisplay('${p.code}')"
              id="curr-${currentCustomer}-${p.code}">
          </div>
          <div class="usage-display ${usageClass}" id="usage-${currentCustomer}-${p.code}">${usageText}</div>
        </div>
      </div>`;
    });
  } else {
    products.forEach(p => {
      const d = getCount(p.code);
      const qty = d.qty !== undefined ? d.qty : '';
      html += `<div class="item-card">
        <div class="item-info">
          <div class="item-name" title="${p.name}">${p.name}</div>
          <div class="item-code">${p.code}</div>
        </div>
        <div class="item-controls">
          <button class="qty-btn" onclick="adjustQty('${p.code}', -1)">−</button>
          <input class="qty-input" type="number" min="0" placeholder="0"
            value="${qty}"
            onchange="setCount('${p.code}','qty',parseInt(this.value)||0)"
            oninput="setCount('${p.code}','qty',parseInt(this.value)||0)"
            id="qty-${currentCustomer}-${p.code}">
          <button class="qty-btn" onclick="adjustQty('${p.code}', 1)">+</button>
        </div>
      </div>`;
    });
  }

  area.innerHTML = html;
}

function updateUsageDisplay(code) {
  const d = getCount(code);
  const cust = CUSTOMERS[currentCustomer];
  const product = cust.products.find(p => p.code === code);
  const prevRaw = d.prev !== undefined ? d.prev : (product && product.prev !== undefined ? product.prev : '');
  const prev = parseFloat(prevRaw);
  const curr = parseFloat(d.curr);
  const el = document.getElementById(`usage-${currentCustomer}-${code}`);
  if (!el) return;
  if (!isNaN(prev) && !isNaN(curr)) {
    const usage = prev - curr;
    const topup = Math.max(0, usage);
    el.textContent = `Used: ${usage}  →  Top-up: ${topup}`;
    el.className = `usage-display ${usage > 0 ? 'has-usage' : ''}`;
  } else {
    el.textContent = '';
    el.className = 'usage-display';
  }
}

function adjustQty(code, delta) {
  const d = getCount(code);
  const current = parseInt(d.qty) || 0;
  const newVal = Math.max(0, current + delta);
  setCount(code, 'qty', newVal);
  const el = document.getElementById(`qty-${currentCustomer}-${code}`);
  if (el) el.value = newVal || '';
}

function updateSummary() {
  const cust = CUSTOMERS[currentCustomer];
  const btn = document.getElementById('sendBtn');
  const line = document.getElementById('summaryLine');
  let filled = 0;

  if (cust.isConsignment) {
    cust.products.forEach(p => {
      const d = getCount(p.code);
      // Only need NOW count — PREV is pre-filled from report
      if (d.curr !== undefined && d.curr !== '') filled++;
    });
    const total = cust.products.length;
    line.innerHTML = `<strong>${filled}/${total}</strong> items counted`;
    btn.disabled = filled === 0;
  } else {
    cust.products.forEach(p => {
      const d = getCount(p.code);
      if (d.qty && d.qty > 0) filled++;
    });
    line.innerHTML = `<strong>${filled}</strong> lines to order`;
    btn.disabled = filled === 0;
  }
}

function openModal() {
  const cust = CUSTOMERS[currentCustomer];
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  overlay.classList.add('show');

  let html = `<h3>Review Order — ${cust.shortName}</h3>
    <div class="rep-field">
      <label>Rep name</label>
      <input type="text" id="repName" placeholder="Your name" value="${localStorage.getItem('repName') || ''}">
    </div>`;

  const cats = [...new Set(cust.products.map(p => p.cat))];

  if (cust.isConsignment) {
    cats.forEach(cat => {
      const items = cust.products.filter(p => p.cat === cat);
      const hasData = items.some(p => {
        const d = getCount(p.code);
        const hasPrev = (d.prev !== undefined && d.prev !== '') || p.prev !== undefined;
        return hasPrev && d.curr !== undefined && d.curr !== '';
      });
      if (!hasData) return;
      html += `<div class="modal-cat-header">${CATEGORIES[cat].label}</div>`;
      items.forEach(p => {
        const d = getCount(p.code);
        const prevVal = (d.prev !== undefined && d.prev !== '') ? d.prev : (p.prev !== undefined ? p.prev : undefined);
        if (prevVal === undefined || d.curr === undefined || d.curr === '') return;
        const usage = parseFloat(prevVal) - parseFloat(d.curr);
        const topup = Math.max(0, usage);
        html += `<div class="preview-row">
          <div class="preview-name">${p.name}<br><span style="color:var(--muted);font-size:10px;">${p.code}</span></div>
          <div>
            <div class="preview-usage">Used: ${usage}</div>
            <div class="preview-qty">Top-up: ${topup}</div>
          </div>
        </div>`;
      });
    });
  } else {
    cats.forEach(cat => {
      const items = cust.products.filter(p => p.cat === cat);
      const hasOrder = items.some(p => (getCount(p.code).qty || 0) > 0);
      if (!hasOrder) return;
      html += `<div class="modal-cat-header">${CATEGORIES[cat].label}</div>`;
      items.forEach(p => {
        const qty = getCount(p.code).qty || 0;
        if (!qty) return;
        html += `<div class="preview-row">
          <div class="preview-name">${p.name}<br><span style="color:var(--muted);font-size:10px;">${p.code}</span></div>
          <div class="preview-qty">×${qty}</div>
        </div>`;
      });
    });
  }

  html += `<div class="notes-field">
    <label>Delivery Address</label>
    <textarea id="deliveryAddress" placeholder="Enter delivery address..." style="margin-bottom:10px;">${localStorage.getItem('deliveryAddress') || ''}</textarea>
    <label>Notes (optional)</label>
    <textarea id="orderNotes" placeholder="Any special instructions..."></textarea>
  </div>
  <div class="modal-actions" style="flex-wrap:wrap;gap:8px;">
    <button class="modal-cancel" onclick="closeModal()">Back</button>
    <button class="modal-cancel" style="flex:1;background:#1a2200;border-color:#e8ff47;color:#e8ff47;" onclick="downloadPDF()">⬇ Save PDF</button>
    <button class="modal-confirm" style="flex:2;" onclick="sendOrder()">✉ Send to Matt</button>
  </div>`;

  content.innerHTML = html;
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');

        rows += `<tr style="background:${bg};">
          <td style="padding:9px 14px;font-family:'Courier New',monospace;font-size:12px;color:#aaa;border-bottom:1px solid #252525;white-space:nowrap;">${p.code}</td>
          <td style="padding:9px 14px;font-family:Arial,sans-serif;font-size:13px;color:#f0f0f0;border-bottom:1px solid #252525;">${p.name}</td>
          <td style="padding:9px 14px;font-family:'Courier New',monospace;font-size:14px;color:#e8ff47;font-weight:700;text-align:center;border-bottom:1px solid #252525;">${qty}</td>
        </tr>`;
      });
    });
  }

  const deliveryRow = deliveryAddress ? `
    <tr><td style="padding:6px 0;font-family:Arial,sans-serif;font-size:12px;color:#888;">Delivery Address</td><td style="padding:6px 0 6px 16px;font-family:Arial,sans-serif;font-size:13px;color:#f0f0f0;">${deliveryAddress.replace(/\n/g,'<br>')}</td></tr>` : '';
  const notesRow = notes ? `
    <tr><td style="padding:6px 0;font-family:Arial,sans-serif;font-size:12px;color:#888;">Notes</td><td style="padding:6px 0 6px 16px;font-family:Arial,sans-serif;font-size:13px;color:#f0f0f0;">${notes}</td></tr>` : '';

  return `<!DOCTYPE html>
<html><body style="margin:0;padding:0;background:#141414;font-family:Arial,sans-serif;">
<div style="max-width:680px;margin:0 auto;background:#141414;">

  <!-- Header -->
  <div style="background:#1a1a1a;border-bottom:3px solid #e8ff47;padding:24px 28px;">
    <div style="font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#666;margin-bottom:6px;">Jones Brothers Print Technology</div>
    <div style="font-size:22px;font-weight:800;color:#f0f0f0;">${cust.name}</div>
    <div style="font-size:13px;color:#888;margin-top:4px;">${cust.isConsignment ? 'Consignment Count &amp; Top-Up Report' : 'Stock Order'}</div>
  </div>

  <!-- Meta -->
  <div style="background:#111;padding:14px 28px;border-bottom:1px solid #2a2a2a;">
    <table style="width:100%;border-collapse:collapse;">
      <tr>
        <td style="font-family:Arial,sans-serif;font-size:12px;color:#888;padding:4px 0;">Date</td>
        <td style="font-family:Arial,sans-serif;font-size:13px;color:#f0f0f0;padding:4px 0 4px 16px;">${dateStr}</td>
        <td style="font-family:Arial,sans-serif;font-size:12px;color:#888;padding:4px 0;">Rep</td>
        <td style="font-family:Arial,sans-serif;font-size:13px;color:#f0f0f0;padding:4px 0 4px 16px;">${repName}</td>
      </tr>
      ${deliveryRow}${notesRow}
    </table>
  </div>

  <!-- Table -->
  <table style="width:100%;border-collapse:collapse;">
    ${rows}
  </table>

  <!-- Footer -->
  <div style="padding:16px 28px;background:#111;border-top:1px solid #2a2a2a;">
    <div style="font-family:Arial,sans-serif;font-size:11px;color:#444;">Sent via JB Stock Count App · ${dateStr}</div>
  </div>

</div>
</body></html>`;
}

function sendOrder() {
  const cust = CUSTOMERS[currentCustomer];
  const repName = document.getElementById('repName').value.trim() || 'Sales Rep';
  const notes = document.getElementById('orderNotes').value.trim();
  const deliveryAddress = document.getElementById('deliveryAddress').value.trim();
  localStorage.setItem('repName', repName);
  if (deliveryAddress) localStorage.setItem('deliveryAddress', deliveryAddress);

  const dateStr = new Date().toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' });
  const subject = cust.isConsignment
    ? `AMC Consignment Count & Top-Up Report — ${dateStr}`
    : `EziBrand Stock Order — ${dateStr}`;

  const htmlBody = buildEmailHTML(cust, repName, dateStr, deliveryAddress, notes);

  // Show sending state
  const content = document.getElementById('modalContent');
  content.innerHTML = `<div class="success-state">
    <div class="success-icon">⏳</div>
    <h3>Sending...</h3>
    <p>Sending report to sales@jonespt.com.au</p>
  </div>`;

  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
    subject: subject,
    message: htmlBody,
    name: repName,
    email: 'sales@jonespt.com.au'
  }).then(() => {
    content.innerHTML = `<div class="success-state">
      <div class="success-icon">✅</div>
      <h3>Sent!</h3>
      <p>Report delivered to <strong>sales@jonespt.com.au</strong></p>
      <div class="modal-actions" style="margin-top:20px;">
        <button class="modal-confirm" onclick="resetAndClose()">Done</button>
      </div>
    </div>`;
  }).catch((err) => {
    content.innerHTML = `<div class="success-state">
      <div class="success-icon">❌</div>
      <h3>Send Failed</h3>
      <p style="color:#ff6b6b;">Error: ${JSON.stringify(err)}<br><br>Please try again or contact support.</p>
      <div class="modal-actions" style="margin-top:20px;">
        <button class="modal-cancel" onclick="closeModal()">Close</button>
      </div>
    </div>`;
  });
}

function buildPDFHTML(cust, repName, dateStr, deliveryAddress, notes) {
  const catColors = { ink: '#1a3a6e', consumables: '#7a3e00', screens: '#3d1a7a', dtf: '#0a4a30' };
  const catText =   { ink: '#2a6abf', consumables: '#bf6a00', screens: '#7a4abf', dtf: '#1a9a60' };

  let rows = '';
  const cats = [...new Set(cust.products.map(p => p.cat))];

  if (cust.isConsignment) {
    cats.forEach(cat => {
      const items = cust.products.filter(p => p.cat === cat);
      const hasData = items.some(p => getCount(p.code).curr !== undefined && getCount(p.code).curr !== '');
      if (!hasData) return;
      const bg = catColors[cat] || '#1a1a3a';
      const tc = catText[cat] || '#4a4abf';
      rows += `<tr><td colspan="5" style="background:${bg};padding:8px 12px;font-family:Arial,sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:${tc};">${CATEGORIES[cat].label}</td></tr>`;
      rows += `<tr style="background:#f5f5f5;">
        <td style="padding:6px 12px;font-family:Arial,sans-serif;font-size:10px;color:#555;font-weight:700;border-bottom:1px solid #ddd;">CODE</td>
        <td style="padding:6px 12px;font-family:Arial,sans-serif;font-size:10px;color:#555;font-weight:700;border-bottom:1px solid #ddd;">DESCRIPTION</td>
        <td style="padding:6px 12px;font-family:Arial,sans-serif;font-size:10px;color:#555;font-weight:700;text-align:center;border-bottom:1px solid #ddd;">PREV</td>
        <td style="padding:6px 12px;font-family:Arial,sans-serif;font-size:10px;color:#555;font-weight:700;text-align:center;border-bottom:1px solid #ddd;">NOW</td>
        <td style="padding:6px 12px;font-family:Arial,sans-serif;font-size:10px;color:#555;font-weight:700;text-align:center;border-bottom:1px solid #ddd;">TOP-UP</td>
      </tr>`;
      items.forEach((p, i) => {
        const d = getCount(p.code);
        if (d.curr === undefined || d.curr === '') return;
        const prevVal = p.prev !== undefined ? p.prev : (d.prev || '—');
        const usage = !isNaN(prevVal) && !isNaN(d.curr) ? parseFloat(prevVal) - parseFloat(d.curr) : '—';
        const topup = typeof usage === 'number' ? Math.max(0, usage) : '—';
        const bg2 = i % 2 === 0 ? '#ffffff' : '#fafafa';
        const topupStyle = typeof topup === 'number' && topup > 0 ? 'font-weight:700;color:#000;' : 'color:#999;';
        rows += `<tr style="background:${bg2};">
          <td style="padding:7px 12px;font-family:'Courier New',monospace;font-size:11px;color:#444;border-bottom:1px solid #eee;white-space:nowrap;">${p.code}</td>
          <td style="padding:7px 12px;font-family:Arial,sans-serif;font-size:12px;color:#222;border-bottom:1px solid #eee;">${p.name}</td>
          <td style="padding:7px 12px;font-family:'Courier New',monospace;font-size:12px;color:#999;text-align:center;border-bottom:1px solid #eee;">${prevVal}</td>
          <td style="padding:7px 12px;font-family:'Courier New',monospace;font-size:12px;color:#222;text-align:center;border-bottom:1px solid #eee;font-weight:700;">${d.curr}</td>
          <td style="padding:7px 12px;font-family:'Courier New',monospace;font-size:13px;text-align:center;border-bottom:1px solid #eee;${topupStyle}">${topup}</td>
        </tr>`;
      });
    });
  } else {
    cats.forEach(cat => {
      const items = cust.products.filter(p => p.cat === cat);
      const hasOrder = items.some(p => (getCount(p.code).qty || 0) > 0);
      if (!hasOrder) return;
      const bg = catColors[cat] || '#1a1a3a';
      const tc = catText[cat] || '#4a4abf';
      rows += `<tr><td colspan="3" style="background:${bg};padding:8px 12px;font-family:Arial,sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:${tc};">${CATEGORIES[cat].label}</td></tr>`;
      rows += `<tr style="background:#f5f5f5;">
        <td style="padding:6px 12px;font-family:Arial,sans-serif;font-size:10px;color:#555;font-weight:700;border-bottom:1px solid #ddd;">CODE</td>
        <td style="padding:6px 12px;font-family:Arial,sans-serif;font-size:10px;color:#555;font-weight:700;border-bottom:1px solid #ddd;">DESCRIPTION</td>
        <td style="padding:6px 12px;font-family:Arial,sans-serif;font-size:10px;color:#555;font-weight:700;text-align:center;border-bottom:1px solid #ddd;">QTY</td>
      </tr>`;
      items.forEach((p, i) => {
        const qty = getCount(p.code).qty || 0;
        if (!qty) return;
        const bg2 = i % 2 === 0 ? '#ffffff' : '#fafafa';
        rows += `<tr style="background:${bg2};">
          <td style="padding:7px 12px;font-family:'Courier New',monospace;font-size:11px;color:#444;border-bottom:1px solid #eee;white-space:nowrap;">${p.code}</td>
          <td style="padding:7px 12px;font-family:Arial,sans-serif;font-size:12px;color:#222;border-bottom:1px solid #eee;">${p.name}</td>
          <td style="padding:7px 12px;font-family:'Courier New',monospace;font-size:13px;color:#000;font-weight:700;text-align:center;border-bottom:1px solid #eee;">${qty}</td>
        </tr>`;
      });
    });
  }

  const deliveryBlock = deliveryAddress ? `<tr><td style="padding:5px 0;font-size:11px;color:#666;font-family:Arial,sans-serif;width:120px;">Delivery Address</td><td style="padding:5px 0 5px 16px;font-size:12px;color:#222;font-family:Arial,sans-serif;">${deliveryAddress.replace(/\n/g,'<br>')}</td></tr>` : '';
  const notesBlock = notes ? `<tr><td style="padding:5px 0;font-size:11px;color:#666;font-family:Arial,sans-serif;">Notes</td><td style="padding:5px 0 5px 16px;font-size:12px;color:#222;font-family:Arial,sans-serif;">${notes}</td></tr>` : '';

  return `<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
  @page { size: A4; margin: 15mm 12mm; }
  body { margin:0; padding:0; background:#fff; font-family:Arial,sans-serif; color:#222; }
  table { border-collapse: collapse; }
</style>
</head><body>
  <!-- Header -->
  <div style="border-bottom:3px solid #222;padding-bottom:14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;">
    <div>
      <div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#888;margin-bottom:4px;">Jones Brothers Print Technology</div>
      <div style="font-size:20px;font-weight:800;color:#111;">${cust.name}</div>
      <div style="font-size:12px;color:#555;margin-top:2px;">${cust.isConsignment ? 'Consignment Count & Top-Up Report' : 'Purchase Order'}</div>
    </div>
    <div style="text-align:right;">
      <div style="font-size:10px;color:#888;">Date</div>
      <div style="font-size:13px;font-weight:700;">${dateStr}</div>
      <div style="font-size:10px;color:#888;margin-top:4px;">Rep</div>
      <div style="font-size:13px;font-weight:700;">${repName}</div>
    </div>
  </div>

  <!-- Meta row -->
  ${deliveryBlock || notesBlock ? `<table style="width:100%;margin-bottom:16px;border:1px solid #eee;border-radius:4px;"><tbody>${deliveryBlock}${notesBlock}</tbody></table>` : ''}

  <!-- Products -->
  <table style="width:100%;">
    ${rows}
  </table>

  <!-- Footer -->
  <div style="margin-top:24px;padding-top:10px;border-top:1px solid #ddd;font-size:10px;color:#aaa;display:flex;justify-content:space-between;">
    <span>Generated by JB Stock Count App</span>
    <span>${dateStr}</span>
  </div>
</body></html>`;
}

function downloadPDF() {
  const cust = CUSTOMERS[currentCustomer];
  const repName = (document.getElementById('repName') && document.getElementById('repName').value.trim()) || localStorage.getItem('repName') || 'Sales Rep';
  const notes = (document.getElementById('orderNotes') && document.getElementById('orderNotes').value.trim()) || '';
  const deliveryAddress = (document.getElementById('deliveryAddress') && document.getElementById('deliveryAddress').value.trim()) || '';
  const dateStr = new Date().toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' });

  const pdfHTML = buildPDFHTML(cust, repName, dateStr, deliveryAddress, notes);

  const printWindow = window.open('', '_blank');
  printWindow.document.write(pdfHTML);
  printWindow.document.close();
  printWindow.focus();
  setTimeout(() => {
    printWindow.print();
  }, 500);
}

function resetAndClose() {
  closeModal();
  // Reset counts for this customer
  const cust = CUSTOMERS[currentCustomer];
  cust.products.forEach(p => { delete counts[`${currentCustomer}-${p.code}`]; });
  renderItems();
  updateSummary();
}
</script>
</body>
</html>
